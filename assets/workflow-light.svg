acity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.8s" begin="0.0s" repeatCount="indefinite"/></circle><path d="M574 69 H642" stroke="#007d92" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><circle r="3.5" fill="#007d92" opacity="0"><animateMotion path="M574 69 L634 69" dur="2.8s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></circle><text x="12" y="134" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#506780" font-weight="600">AI APPLICATIONS</text><rect x="12" y="147" width="236" height="64" rx="10" fill="#f6f9fc" stroke="#ccdbe8"/><text x="27" y="173" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#162c46" font-weight="600">User prompt</text><text x="27" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#506780" font-weight="400">Guidance or insights</text><rect x="332" y="147" width="236" height="64" rx="10" fill="#f6f9fc" stroke="#ccdbe8"/><text x="347" y="173" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#162c46" font-weight="600">Granite 8B + Flask</text><text x="347" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#506780" font-weight="400">Fine-tuned local model</text><rect x="652" y="147" width="236" height="64" rx="10" fill="#f6f9fc" stroke="#ccdbe8"/><text x="667" y="173" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#162c46" font-weight="600">Chatbot / Dashboard</text><text x="667" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#506780" font-weight="400">Requested views</text><path d="M254 179 H322" stroke="#007d92" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><circle r="3.5" fill="#007d92" opacity="0"><animateMotion path="M254 179 L314 179" dur="2.8s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.8s" begin="0.0s" repeatC